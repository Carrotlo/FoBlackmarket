name: FoBlackmarket
description: Highly customizable black market plugin for NPC-driven servers
version: '${version}'
main: me.foesio.foBlackmarket.FoBlackmarket
api-version: '1.21'
authors: [Carrotio]
softdepend: [PlaceholderAPI, Vault]

commands:
  blackmarket:
    description: Shows black market information
    aliases: [bm, foblackmarket]
  foblackmarketadmin:
    description: Admin command for FoBlackmarket
    aliases: [blackmarketadmin, bmadmin]

permissions:
  foblackmarket.use:
    description: Allows players to use /blackmarket
    default: true
  foblackmarket.admin:
    description: Allows access to FoBlackmarket admin tools
    default: op
