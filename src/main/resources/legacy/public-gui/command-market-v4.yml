# Public /blackmarket browser GUI.
# Slot numbers are 0-based Minecraft inventory slots.
# Placeholders: {time_remaining}, {selected_rarity}, {showing_offers}
title: "&8ʙʟᴀᴄᴋ ᴍᴀʀᴋᴇᴛ"
rows: 6

slots:
  timer: 4
  rarities: [11, 12, 13, 14, 15, 16, 17]
  offers: [28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
  previous-page: 36
  next-page: 44

items:
  timer:
    material: CLOCK
    name: ":clock: {theme}&lMARKET RESET"
    lore:
      - "&8ɪɴꜰᴏ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fTime until reset: {theme}{time_remaining}"
      - "&7&l | &fSelected rarity: {theme}{selected_rarity}"
      - "&7&l | &f{showing_offers}"
  empty-offer:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: " "
    lore: []
  previous-page:
    material: ARROW
    name: "{theme}&lPREVIOUS PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage {page}/{max_page}"
      - " "
      - "{good}→ Click to view the previous page ←"
  next-page:
    material: ARROW
    name: "{theme}&lNEXT PAGE"
    lore:
      - "&8ʙᴜᴛᴛᴏɴ"
      - " "
      - "&eⓘ Information ↓"
      - "&7&l | &fPage {page}/{max_page}"
      - " "
      - "{good}→ Click to view the next page ←"

rarity-item:
  name: "{theme}&l{rarity_upper}"
  lore:
    - "&8ʙᴜᴛᴛᴏɴ"
    - " "
    - "&eⓘ Information ↓"
    - "&7&l | &fOffers: {theme}{offer_count}"
    - "&7&l | &fStatus: {selection_status}"
    - " "
    - "{click_line}"
  selected: "{good}Selected"
  unselected: "{muted}Click to view this rarity."
  selected-click-line: ""
  unselected-click-line: "{good}→ Click to view {rarity_plain} ←"

offer-item:
  fallback-material: CHEST
  name: "{reward}"
  lore:
    - "&8ʙᴜᴛᴛᴏɴ"
    - " "
    - "&eⓘ Information ↓"
    - "&7&l | &fRarity: {rarity}"
    - "&7&l | &fStock: {theme}{stock}"
    - "&7&l | &fCost: {theme}{cost}"
    - "&7&l | &fChance: {theme}{chance}%"
    - "{commands_line}"
    - " "
    - "{status_line}"
  commands-line: "&7&l | &fCommands: {theme}{commands}"
  preview-line: "&7&l | {muted}Preview only."

labels:
  no-rarity: "{muted}None"
  showing-no-offers: "{muted}Showing 0 offers."
  showing-offers: "{muted}Showing {first_offer}-{last_offer} of {total_offers} offers."
